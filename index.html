<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Disney+</title>
    <link rel="stylesheet" href="dist/css/main.css">
</head>
<body>
    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__content__brand">
                <img src="./dist/images/disneyplus.svg" alt="Disney+">
            </h1>
            <h3 class="title--sm">As melhores histórias em um só lugar.</h3>
            <p>
                <a href="#" class="link-text">Assinar o disney plus+</a>
                <br>
                <span class="text">
                    R$27,90/mês ou R$ 279/ano á vista*
                </span>
            </p>
            <ul class="hero__content__combos">
                <li class="hero__content__combos__combo">
                    <img src="dist/images/logos/disney_star_plus.png" alt="DisneyPlus - StarPlus - ComboPlus">
                    <button>Assine agora</button>
                    <span class="text">R$ 45,90/mês*</span>
                </li>
                <li class="hero__content__combos__combo">
                    <img src="dist/images/logos/disney_star_plus_starzplay.png" alt="StarPlus - DisneyPlus - StarzPlay">
                    <button>Assine agora</button>
                    <span class="text">R$ 55,90/mês*</span>
                </li>
            </ul>
            <p class="text--sm">*O preço pode variar caso a assinatura seja feita através de outras plataformas.</p>
        </div>
    </section>
    <section class="shows">
        <ul class="shows__list">
            <li class="shows__list_itens">
                <img src="dist/images/" alt="">
            </li>
        </ul>
    </section>
</body>
</html>
